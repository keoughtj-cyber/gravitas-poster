name: Daily music

# Generates one dark instrumental clip a day into music/output/. It never posts anything.

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Make the clip for this date (YYYY-MM-DD). Leave blank for today."
        required: false

permissions:
  contents: write

concurrency:
  group: daily-music
  cancel-in-progress: false

jobs:
  music:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: music/requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Cache the Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-stable-audio-open-small

      - name: Install requirements
        run: pip install -r music/requirements.txt

      - name: Generate the clip
        id: gen
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DATE_INPUT: ${{ github.event.inputs.date }}
        run: python music/generate.py ${DATE_INPUT:+--date "$DATE_INPUT"}

      - name: Keep the clip as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: gravitas-music-${{ steps.gen.outputs.date }}
          path: music/output/${{ steps.gen.outputs.date }}/
          retention-days: 30

      - name: Commit the clip
        env:
          CLIP_DATE: ${{ steps.gen.outputs.date }}
        run: |
          git config user.name "gravitas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A music/output
          if git diff --cached --quiet; then
            echo "Nothing changed, skipping the commit."
            exit 0
          fi
          git commit -m "Add daily clip $CLIP_DATE"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
