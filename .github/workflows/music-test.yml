name: Music test

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First date (YYYY-MM-DD)"
        required: true
      days:
        description: "How many days of tracks"
        default: "3"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: |
          pip install -r requirements.txt
          pip install torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install stable-audio-tools==0.0.19
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-stable-audio-open-small
      - name: Generate
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python ai_music.py "${{ github.event.inputs.start }}" "${{ github.event.inputs.days }}"
      - name: Save
        run: |
          git config user.name "gravitas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/music_test
          git commit -m "Music test tracks"
          git pull --rebase
          git push
